name: "CodeQL Advanced"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 6 * * 3'

permissions:
  security-events: write
  contents: read
  packages: read
  actions: read

jobs:
  codeql:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-codeql.yml@299ac0f1414aec64c4a835af3ad95ffd9a9964ba # main
    with:
      srcFolder: src
      solutionFile: Splat.DI.SourceGenerator.slnx
      installWorkloads: false
      analyzeCSharp: true
      analyzeActions: true
      analyzeJavaScript: false
